<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Finary One — Intelligence Hub</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@300&display=swap');

:root {
  --bg: #ece8e0;
  --cream: #f5f1ea;
  --cream2: #ede9e0;
  --white: #ffffff;
  --gold: #c9a96e;
  --gold-dark: #9e7840;
  --gold-light: #e4c48a;
  --navy: #0e1535;
  --navy2: #1a2448;
  --tpe-accent: #7a5c3a;
  --tpe-accent-light: #c4956a;
  --text: #1a1508;
  --text2: #4a4030;
  --text3: #8a7a62;
  --border: rgba(90,70,30,0.13);
  --border2: rgba(90,70,30,0.22);
  --shadow-sm: 0 2px 8px rgba(30,20,5,0.07), 0 0 0 1px rgba(90,70,30,0.08);
  --shadow-md: 0 4px 20px rgba(30,20,5,0.10), 0 0 0 1px rgba(90,70,30,0.10);
  --shadow-lg: 0 8px 32px rgba(30,20,5,0.13), 0 0 0 1px rgba(90,70,30,0.12);
  --serif: 'Playfair Display', Georgia, serif;
  --sans: 'DM Sans', sans-serif;
  --mono: 'DM Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; min-height: 100vh; }

/* ─── NAVBAR ─── */
.navbar {
  position: sticky; top: 0; z-index: 200;
  background: rgba(245,241,234,0.94); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border2);
  box-shadow: 0 1px 12px rgba(30,20,5,0.06);
  padding: 0 40px; height: 58px;
  display: flex; align-items: center; justify-content: space-between; gap: 32px;
}
.nav-left { display: flex; align-items: baseline; gap: 10px; cursor: pointer; }
.nav-brand-name { font-family: var(--serif); font-size: 20px; font-weight: 700; color: var(--navy); letter-spacing: -0.02em; line-height: 1; }
.nav-brand-name em { color: var(--gold); font-style: italic; }
.nav-brand-sub { font-size: 10px; font-weight: 400; color: var(--text3); letter-spacing: 0.12em; text-transform: uppercase; }
.nav-search { flex: 1; max-width: 380px; position: relative; }
.nav-search input { width: 100%; background: rgba(255,255,255,0.8); border: 1px solid var(--border2); color: var(--text); font-family: var(--sans); font-size: 13px; padding: 8px 14px 8px 34px; outline: none; border-radius: 100px; box-shadow: var(--shadow-sm); transition: border-color 0.15s, box-shadow 0.15s; }
.nav-search input::placeholder { color: var(--text3); }
.nav-search input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,169,110,0.18); }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 13px; pointer-events: none; }
.nav-datetime { font-family: var(--mono); font-size: 10px; color: var(--text3); letter-spacing: 0.04em; text-align: right; line-height: 1.5; flex-shrink: 0; }

/* ─── BRIEFING BAR ─── */
.briefing-bar { background: var(--navy); padding: 9px 40px; display: flex; align-items: center; gap: 12px; }
.live-pill { display: flex; align-items: center; gap: 5px; background: rgba(201,169,110,0.2); border: 1px solid rgba(201,169,110,0.35); padding: 2px 10px; border-radius: 100px; flex-shrink: 0; }
.live-dot { width: 5px; height: 5px; background: var(--gold-light); border-radius: 50%; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }
.live-text { font-size: 9px; font-weight: 500; color: var(--gold-light); letter-spacing: 0.1em; text-transform: uppercase; }
.briefing-stats { font-size: 12px; color: rgba(255,255,255,0.55); }
.briefing-stats strong { color: var(--gold-light); font-weight: 500; }
.briefing-time { margin-left: auto; font-family: var(--mono); font-size: 10px; color: rgba(255,255,255,0.3); }

/* ─── TABS ─── */
.tabs-bar { background: var(--cream2); border-bottom: 1px solid var(--border2); padding: 0 40px; display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; }
.tabs-bar::-webkit-scrollbar { display: none; }
.tab { padding: 12px 20px; font-size: 12px; font-weight: 400; color: var(--text3); letter-spacing: 0.04em; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s; user-select: none; }
.tab:hover { color: var(--text2); }
.tab.active { color: var(--gold-dark); font-weight: 500; border-bottom-color: var(--gold); }
.tab-new { font-size: 8px; font-weight: 600; color: var(--gold-dark); background: rgba(201,169,110,0.18); padding: 1px 5px; border-radius: 3px; margin-left: 5px; vertical-align: middle; }

/* ─── PAGES ─── */
.page { display: none; }
.page.active { display: block; }

/* ─── HOME PAGE ─── */
#homePage { padding: 36px 40px 64px; }

.section-label { font-size: 10px; font-weight: 600; color: var(--gold-dark); letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
.section-label::after { content:''; flex:1; height:1px; background:var(--border2); }

/* hero */
.hero-section { margin-bottom: 44px; }
.hero-grid { display: grid; grid-template-columns: 1.65fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; }
.hero-main { grid-row: 1/3; background: var(--navy2); border-radius: 16px; padding: 32px 28px; display: flex; flex-direction: column; justify-content: flex-end; min-height: 300px; position: relative; cursor: pointer; box-shadow: var(--shadow-lg); transition: transform 0.2s, box-shadow 0.2s; overflow: hidden; }
.hero-main:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(30,20,5,0.18); }
.hero-main-bg { position: absolute; inset: 0; background: linear-gradient(135deg,#0e1535 0%,#1a2448 45%,#2a1f5e 100%); }
.hero-main-overlay { position: absolute; inset: 0; background: linear-gradient(to top,rgba(14,21,53,0.97) 25%,rgba(14,21,53,0.3) 100%); }
.hero-main-content { position: relative; z-index: 1; }
.hero-cat-badge { display: inline-block; font-size: 9px; font-weight: 500; color: var(--gold-light); background: rgba(201,169,110,0.18); border: 1px solid rgba(201,169,110,0.3); padding: 3px 10px; border-radius: 100px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; }
.hero-main-title { font-family: var(--serif); font-size: 22px; font-weight: 700; color: #fff; line-height: 1.3; margin-bottom: 10px; }
.hero-main-meta { display: flex; align-items: center; gap: 8px; }
.hero-source { font-size: 11px; color: var(--gold-light); font-weight: 500; }
.hero-time { font-family: var(--mono); font-size: 10px; color: rgba(255,255,255,0.35); }
.hero-secondary { background: var(--white); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; min-height: 130px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); transition: transform 0.15s, box-shadow 0.15s; }
.hero-secondary:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.hero-sec-cat { font-size: 9px; font-weight: 600; color: var(--gold-dark); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 7px; }
.hero-sec-title { font-family: var(--serif); font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.4; flex: 1; margin-bottom: 10px; }
.hero-secondary:hover .hero-sec-title { color: var(--navy); }
.hero-sec-meta { display: flex; align-items: center; gap: 6px; }
.hero-sec-source { font-size: 11px; color: var(--gold-dark); font-weight: 500; }
.hero-sec-time { font-family: var(--mono); font-size: 10px; color: var(--text3); }

/* cat grids */
.cat-grid-wrap { margin-bottom: 44px; }
.cat-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
.cat-grid-2 { display: grid; grid-template-columns: repeat(2,1fr); gap: 12px; margin-top: 12px; }
.cat-card { background: var(--white); border-radius: 14px; padding: 20px 22px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); transition: transform 0.15s, box-shadow 0.15s; }
.cat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.cat-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.cat-card-title { font-size: 10px; font-weight: 600; color: var(--gold-dark); letter-spacing: 0.1em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
.cat-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }
.cat-count { font-family: var(--mono); font-size: 10px; color: var(--text3); background: rgba(201,169,110,0.1); padding: 2px 7px; border-radius: 20px; }

/* article list items */
.art-item { padding: 9px 0; border-bottom: 1px solid rgba(90,70,30,0.06); }
.art-item:last-child { border-bottom: none; padding-bottom: 0; }
.art-item:first-child { padding-top: 0; }
.art-title-link { font-size: 13px; font-weight: 400; color: var(--text); line-height: 1.5; margin-bottom: 4px; cursor: pointer; transition: color 0.15s; display: block; }
.art-title-link:hover { color: var(--navy); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--gold); }
.art-meta { display: flex; align-items: center; gap: 6px; }
.art-source { font-size: 11px; font-weight: 500; color: var(--gold-dark); }
.art-sep { font-size: 10px; color: var(--border2); }
.art-time { font-family: var(--mono); font-size: 10px; color: var(--text3); }
.art-summary-inline { margin-top: 7px; padding: 8px 12px; background: rgba(201,169,110,0.07); border-left: 2px solid var(--gold); border-radius: 0 6px 6px 0; font-size: 12px; color: var(--text2); line-height: 1.65; }

/* TPE section */
.tpe-section { margin-bottom: 44px; }
.tpe-banner { background: linear-gradient(135deg,#2c1f0e 0%,#3d2c14 50%,#2c1f0e 100%); border-radius: 16px 16px 0 0; padding: 18px 28px; display: flex; align-items: center; justify-content: space-between; }
.tpe-banner-left { display: flex; align-items: center; gap: 14px; }
.tpe-banner-icon { width: 36px; height: 36px; border-radius: 10px; background: rgba(201,169,110,0.2); border: 1px solid rgba(201,169,110,0.35); display: flex; align-items: center; justify-content: center; font-size: 16px; }
.tpe-banner-title { font-family: var(--serif); font-size: 18px; font-weight: 700; color: #fff; }
.tpe-banner-sub { font-size: 11px; color: rgba(201,169,110,0.7); margin-top: 1px; }
.tpe-banner-stats { display: flex; gap: 24px; }
.tpe-stat-n { font-family: var(--serif); font-size: 22px; font-weight: 700; color: var(--gold-light); line-height: 1; }
.tpe-stat-l { font-size: 9px; color: rgba(255,255,255,0.4); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }
.tpe-grid-wrap { background: #f0ede6; border: 1px solid rgba(160,120,64,0.2); border-top: none; border-radius: 0 0 16px 16px; padding: 20px; box-shadow: var(--shadow-md); }
.tpe-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
.tpe-card { background: var(--white); border-radius: 12px; padding: 16px 18px; border: 1px solid rgba(160,120,64,0.18); box-shadow: 0 2px 10px rgba(60,35,5,0.08); transition: transform 0.15s, box-shadow 0.15s; }
.tpe-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(60,35,5,0.13); }
.tpe-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding-bottom: 9px; border-bottom: 1px solid rgba(160,120,64,0.12); }
.tpe-card-title { font-size: 10px; font-weight: 600; color: var(--tpe-accent); letter-spacing: 0.1em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
.tpe-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--tpe-accent-light); }
.tpe-badge { font-size: 9px; color: var(--tpe-accent); background: rgba(122,92,58,0.1); border: 1px solid rgba(122,92,58,0.2); padding: 2px 7px; border-radius: 20px; font-family: var(--mono); }
.tpe-item { padding: 9px 0; border-bottom: 1px solid rgba(122,92,58,0.07); }
.tpe-item:last-child { border-bottom: none; padding-bottom: 0; }
.tpe-item:first-child { padding-top: 0; }
.tpe-title-link { font-size: 13px; font-weight: 400; color: var(--text); line-height: 1.5; margin-bottom: 5px; cursor: pointer; transition: color 0.15s; display: block; }
.tpe-title-link:hover { color: var(--tpe-accent); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--tpe-accent-light); }
.tpe-item-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tpe-source { font-size: 11px; font-weight: 500; color: var(--tpe-accent-light); }
.tpe-size-tag { font-size: 9px; padding: 1px 6px; border-radius: 3px; letter-spacing: 0.04em; border: 1px solid; }
.tpe-time { font-family: var(--mono); font-size: 10px; color: var(--text3); }
.tpe-sources-bar { margin-top: 10px; padding: 10px 0 0; border-top: 1px solid rgba(160,120,64,0.15); display: flex; align-items: center; gap: 8px; }
.tpe-sources-label { font-size: 10px; color: var(--text3); }
.tpe-source-link { font-size: 11px; color: var(--tpe-accent); text-decoration: none; padding: 3px 10px; border: 1px solid rgba(122,92,58,0.2); border-radius: 20px; transition: all 0.15s; }
.tpe-source-link:hover { background: rgba(122,92,58,0.1); border-color: rgba(122,92,58,0.35); }

/* themes */
.themes-card { background: var(--navy); border-radius: 16px; padding: 22px 24px; box-shadow: var(--shadow-lg); }
.themes-heading { font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.35); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 14px; }
.themes-list { display: flex; flex-wrap: wrap; gap: 7px; }
.theme-tag { font-size: 11px; color: rgba(255,255,255,0.5); padding: 5px 13px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 100px; cursor: pointer; transition: all 0.15s; }
.theme-tag:hover { color: var(--gold-light); border-color: rgba(201,169,110,0.35); background: rgba(201,169,110,0.08); }
.theme-tag.active { background: var(--gold); color: var(--navy); border-color: var(--gold); font-weight: 500; }
.tag-n { font-size: 9px; opacity: 0.5; margin-left: 2px; }

/* ─── ARTICLE PAGE ─── */
#articlePage { padding: 0 0 64px; }

.article-hero {
  background: var(--navy);
  padding: 48px 40px 56px;
  position: relative; overflow: hidden;
}
.article-hero-bg { position: absolute; inset: 0; background: linear-gradient(135deg,#0e1535 0%,#1a2448 50%,#2a1f5e 100%); }
.article-hero-overlay { position: absolute; inset: 0; background: radial-gradient(ellipse at 70% 50%, rgba(201,169,110,0.06) 0%, transparent 60%); }
.article-hero-content { position: relative; z-index: 1; max-width: 780px; }
.article-back { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,0.45); cursor: pointer; margin-bottom: 20px; transition: color 0.15s; letter-spacing: 0.03em; border: none; background: none; padding: 0; }
.article-back:hover { color: var(--gold-light); }
.article-back-arrow { font-size: 14px; }
.article-badge { display: inline-block; font-size: 9px; font-weight: 600; color: var(--gold-light); background: rgba(201,169,110,0.18); border: 1px solid rgba(201,169,110,0.3); padding: 4px 12px; border-radius: 100px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 16px; }
.article-hero-title { font-family: var(--serif); font-size: 32px; font-weight: 700; color: #fff; line-height: 1.25; margin-bottom: 20px; }
.article-hero-meta { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.article-meta-source { font-size: 13px; color: var(--gold-light); font-weight: 500; }
.article-meta-time { font-family: var(--mono); font-size: 11px; color: rgba(255,255,255,0.35); }
.article-meta-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.article-tag { font-size: 10px; color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); padding: 2px 9px; border-radius: 100px; }

.article-body { max-width: 780px; margin: 0 auto; padding: 40px 40px 0; }

/* summary box */
.article-summary-box {
  background: var(--white); border-radius: 16px; padding: 28px 32px;
  box-shadow: var(--shadow-md); border: 1px solid var(--border);
  margin-bottom: 32px; position: relative;
}
.article-summary-box::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: linear-gradient(to bottom, var(--gold), var(--gold-light)); border-radius: 4px 0 0 4px; }
.summary-label { font-size: 9px; font-weight: 600; color: var(--gold-dark); letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 12px; }
.summary-text { font-size: 15px; color: var(--text); line-height: 1.75; font-weight: 400; }

/* analysis */
.article-analysis { margin-bottom: 32px; }
.analysis-title { font-family: var(--serif); font-size: 18px; font-weight: 700; color: var(--navy); margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border2); }

.analysis-block { margin-bottom: 20px; }
.analysis-block-label { font-size: 10px; font-weight: 600; color: var(--gold-dark); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; gap: 7px; }
.analysis-block-label::before { content: ''; width: 3px; height: 12px; background: var(--gold); border-radius: 2px; flex-shrink: 0; }
.analysis-block-text { font-size: 14px; color: var(--text2); line-height: 1.75; }

/* key figures */
.key-figures { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 28px; }
.key-figure { background: var(--white); border-radius: 12px; padding: 16px 18px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); text-align: center; }
.key-figure-value { font-family: var(--serif); font-size: 24px; font-weight: 700; color: var(--navy); line-height: 1; margin-bottom: 6px; }
.key-figure-label { font-size: 11px; color: var(--text3); line-height: 1.4; }

/* signal box */
.signal-box { background: linear-gradient(135deg, rgba(14,21,53,0.04), rgba(14,21,53,0.08)); border: 1px solid rgba(14,21,53,0.15); border-radius: 12px; padding: 20px 24px; margin-bottom: 28px; }
.signal-box-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.signal-icon { width: 28px; height: 28px; background: var(--navy); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
.signal-title { font-size: 12px; font-weight: 600; color: var(--navy); letter-spacing: 0.04em; }
.signal-text { font-size: 13px; color: var(--text2); line-height: 1.7; }

/* CTA source */
.article-cta { background: var(--cream2); border-radius: 14px; padding: 22px 28px; display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--border2); box-shadow: var(--shadow-sm); margin-bottom: 32px; }
.article-cta-left { }
.article-cta-label { font-size: 10px; font-weight: 600; color: var(--text3); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; }
.article-cta-source { font-size: 14px; font-weight: 500; color: var(--text); }
.article-cta-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--navy); color: #fff; font-family: var(--sans); font-size: 13px; font-weight: 500; padding: 10px 22px; border-radius: 100px; border: none; cursor: pointer; text-decoration: none; transition: background 0.15s, transform 0.15s; white-space: nowrap; }
.article-cta-btn:hover { background: var(--navy2); transform: translateY(-1px); }
.article-cta-btn-arrow { font-size: 14px; }

/* related */
.related-section { }
.related-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-top: 14px; }
.related-card { background: var(--white); border-radius: 12px; padding: 16px 18px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; }
.related-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.related-cat { font-size: 9px; font-weight: 600; color: var(--gold-dark); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 7px; }
.related-title { font-family: var(--serif); font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.4; margin-bottom: 8px; }
.related-card:hover .related-title { color: var(--navy); }
.related-meta { font-size: 11px; color: var(--gold-dark); }

/* footer */
footer { background: var(--navy); padding: 16px 40px; display: flex; align-items: center; justify-content: space-between; }
.footer-brand { font-family: var(--serif); font-size: 14px; color: rgba(255,255,255,0.35); }
.footer-brand em { color: var(--gold); font-style: italic; }
.footer-info { font-family: var(--mono); font-size: 10px; color: rgba(255,255,255,0.22); letter-spacing: 0.04em; }

.no-results { padding: 60px; text-align: center; }
.no-results p { font-size: 14px; color: var(--text3); }

@media(max-width:900px){
  .navbar,.briefing-bar,.tabs-bar,#homePage,.article-body { padding-left:16px; padding-right:16px; }
  .article-hero { padding: 32px 16px 40px; }
  .hero-grid { grid-template-columns:1fr; }
  .hero-main { grid-row:auto; min-height:220px; }
  .cat-grid,.tpe-grid,.key-figures,.related-grid { grid-template-columns:1fr; }
  .cat-grid-2 { grid-template-columns:1fr; }

// ─────────────────────────────────────────────
// FIX 1 : getTitle() — fallback sur summary si title est vide
// ─────────────────────────────────────────────
function getTitle(item) {
  if (item.title && item.title.trim()) return item.title.trim();
  // Fallback: première phrase du summary tronquée à 120 chars
  if (item.summary && item.summary.trim()) {
    const s = item.summary.trim();
    const first = s.split('.')[0];
    return first.length > 120 ? first.substring(0, 117) + '…' : first;
  }
  return 'Article sans titre';
}

// ─────────────────────────────────────────────
// FIX 2 : getSource() — fallback sur URL hostname si source vide
// ─────────────────────────────────────────────
function getSource(item) {
  if (item.source && item.source.trim()) return item.source.trim();
  if (item.url && item.url.trim()) {
    try { return new URL(item.url).hostname.replace('www.', ''); } catch(e) {}
  }
  return 'Source inconnue';
}

// ─────────────────────────────────────────────
// FIX 3 : normalizeCategory() — mappe les catégories proches
// Les flux fusacq/JDE sont catégorisés "M&A France" ou "Cessions TPE/PME/ETI" par Claude.
// On s'assure que les articles TPE ont bien la bonne catégorie ET une taille détectée.
// ─────────────────────────────────────────────
function normalizeItem(item) {
  const clone = {...item};

  // Détecter la taille depuis les tags si absente
  if (!clone.taille || clone.taille === '') {
    const tags = (clone.tags || '').toLowerCase();
    const title = getTitle(clone).toLowerCase();
    const combined = tags + ' ' + title;
    if (combined.includes('eti')) clone.taille = 'ETI';
    else if (combined.includes('pme')) clone.taille = 'PME';
    else if (combined.includes('tpe')) clone.taille = 'TPE';
  }

  // Si la catégorie est "Cessions TPE/PME/ETI" mais taille encore vide → forcer PME
  if (clone.category === 'Cessions TPE/PME/ETI' && !clone.taille) {
    clone.taille = 'PME';
  }

  return clone;
}

function timeAgo(d){const s=Math.floor((Date.now()-new Date(d))/1000);if(s<60)return'à l\'instant';if(s<3600)return`${Math.floor(s/60)} min`;if(s<86400)return`${Math.floor(s/3600)} h`;return`${Math.floor(s/86400)} j`;}

function getFiltered(){

}

    const items=tpe.filter(i=>i.taille===size);
    const card=document.createElement('div');card.className='tpe-card';
    card.innerHTML=`<div class="tpe-card-header"><span class="tpe-card-title"><span class="tpe-dot"></span>${size}</span><span class="tpe-badge">${items.length} annonce${items.length>1?'s':''}</span></div>${items.length?items.map(tpeItemHTML).join(''):'<p style="font-size:12px;color:var(--text3);padding:8px 0">Aucune annonce</p>'}`;
    grid.appendChild(card);
  });
}

function renderHome(){
  const filtered=getFiltered();
  const page=document.getElementById('homePage');
  const total=allData.length+tpeData.length;
  const fiscal=allData.filter(i=>i.category==='Patrimoine & Fiscalité').length;
  const deals=allData.filter(i=>i.category==='M&A France').length;
  document.getElementById('briefingText').innerHTML=`<strong>${total}</strong> articles · <strong>${fiscal}</strong> signaux fiscaux · <strong>${deals}</strong> deals M&A · <strong>${tpeData.length}</strong> cessions TPE/PME`;
  const t=lastUpdated?lastUpdated.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'—';
  document.getElementById('briefingTime').textContent=`Mis à jour · ${t}`;
  document.getElementById('footerInfo').textContent=`Dernière actualisation · ${t} · Auto-refresh 30 min`;
  page.innerHTML='';

  if(activeTab==='Cessions TPE/PME/ETI'){renderTPESection(page);return;}
  if(!filtered.length){page.innerHTML='<div class="no-results"><p>Aucun résultat pour cette recherche.</p></div>';return;}

  // HERO — seulement si titre disponible
  if(activeTab==='Tous'&&!searchQuery&&!activeTag){
    // Prendre les 3 articles les plus récents AVEC un contenu
    const heroItems=[...filtered]
      .sort((a,b)=>new Date(b.published_at)-new Date(a.published_at))
      .slice(0,3);
    const h0=heroItems[0];
    const hs=document.createElement('div');hs.className='hero-section';
    hs.innerHTML=`
      <div class="section-label">À la une</div>
      <div class="hero-grid">
        <div class="hero-main" onclick="openArticle(${h0?.id})">
          <div class="hero-main-bg"></div><div class="hero-main-overlay"></div>
          <div class="hero-main-content">
            <span class="hero-cat-badge">${h0?.category||''}</span>
            <div class="hero-main-title">${getTitle(h0||{})}</div>
            <div class="hero-main-meta">
              <span class="hero-source">${getSource(h0||{})}</span>
              <span class="hero-time">il y a ${timeAgo(h0?.published_at)}</span>
            </div>
          </div>
        </div>
        ${heroItems.slice(1,3).map(item=>`
          <div class="hero-secondary" onclick="openArticle(${item.id})">
            <div>
              <div class="hero-sec-cat">${item.category}</div>
              <div class="hero-sec-title">${getTitle(item)}</div>
            </div>
            <div class="hero-sec-meta">
              <span class="hero-sec-source">${getSource(item)}</span>
              <span class="art-sep">·</span>
              <span class="hero-sec-time">il y a ${timeAgo(item.published_at)}</span>
            </div>
          </div>`).join('')}
      </div>`;
    page.appendChild(hs);
  }

  // CATS
  const catSec=document.createElement('div');catSec.className='cat-grid-wrap';
  if(activeTab!=='Tous'){
    catSec.innerHTML=`<div class="section-label">${activeTab}</div><div class="cat-grid" style="grid-template-columns:1fr;"><div class="cat-card"><div class="cat-card-header"><span class="cat-card-title"><span class="cat-dot"></span>${activeTab}</span><span class="cat-count">${filtered.length}</span></div>${filtered.map(artHTML).join('')}</div></div>`;
  } else {
    const lbl=document.createElement('div');lbl.className='section-label';lbl.textContent='Toutes les catégories';catSec.appendChild(lbl);
    const groups=groupBy(filtered);const cats=Object.entries(groups);
    [[0,3],[3,6]].forEach(([from,to])=>{
      const slice=cats.slice(from,to);if(!slice.length)return;
      const grid=document.createElement('div');grid.className='cat-grid';grid.style.marginTop=from>0?'12px':'0';
      slice.forEach(([cat,items])=>{const div=document.createElement('div');div.className='cat-card';div.innerHTML=`<div class="cat-card-header"><span class="cat-card-title"><span class="cat-dot"></span>${cat}</span><span class="cat-count">${items.length}</span></div>${items.slice(0,3).map(artHTML).join('')}`;grid.appendChild(div);});
      catSec.appendChild(grid);
    });
    const last=cats.slice(6,8);if(last.length){const g=document.createElement('div');g.className='cat-grid-2';last.forEach(([cat,items])=>{const div=document.createElement('div');div.className='cat-card';div.innerHTML=`<div class="cat-card-header"><span class="cat-card-title"><span class="cat-dot"></span>${cat}</span><span class="cat-count">${items.length}</span></div>${items.slice(0,3).map(artHTML).join('')}`;g.appendChild(div);});catSec.appendChild(g);}
  }
  page.appendChild(catSec);

  if(activeTab==='Tous'&&!searchQuery&&!activeTag) renderTPESection(page);

  if(activeTab==='Tous'){
    const tags=getAllTags();const tw=document.createElement('div');tw.className='themes-card';
    tw.innerHTML=`<div class="themes-heading">Thèmes du moment</div><div class="themes-list">${tags.map(([tag,count])=>`<span class="theme-tag ${activeTag===tag?'active':''}" onclick="filterTag('${tag}')">${tag}<span class="tag-n">${count}</span></span>`).join('')}</div>`;
    page.appendChild(tw);
  }
}

function filterTag(tag){activeTag=activeTag===tag?'':tag;renderHome();}

// ── EVENTS ──
document.getElementById('tabsBar').addEventListener('click',e=>{
  const t=e.target.closest('.tab');if(!t)return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');activeTab=t.dataset.cat;activeTag='';renderHome();
});

let st;
document.getElementById('searchInput').addEventListener('input',e=>{
  clearTimeout(st);st=setTimeout(()=>{searchQuery=e.target.value;if(currentArticleId===null)renderHome();},220);
});

document.querySelector('.nav-left').addEventListener('click',goHome);

// ── FETCH + NORMALIZE ──
async function fetchArticles() {
  try {
    const res = await fetch(DATA_URL + "?t=" + Date.now());
    const data = await res.json();
    if (Array.isArray(data) && data.length > 0) {
      const normalized = data.map(normalizeItem);
      // Filtrer les articles "vides" (sans summary ET sans title)
      const valid = normalized.filter(i => (i.title && i.title.trim()) || (i.summary && i.summary.trim()));
      allData = valid.filter(i => i.category !== 'Cessions TPE/PME/ETI');
      tpeData = valid.filter(i => i.category === 'Cessions TPE/PME/ETI');
    }
  } catch(e) {
    console.warn('Fetch articles failed, using mock data', e);
  }
  lastUpdated = new Date();
  renderHome();
}

updateDatetime();
setInterval(updateDatetime, 30000);
setInterval(fetchArticles, 30 * 60 * 1000);
fetchArticles();
</script>
</body>
