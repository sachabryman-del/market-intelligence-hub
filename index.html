<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Finary One — Intelligence Hub</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@300&display=swap');
 
:root {
  --bg: #ece8e0;
  --cream: #f5f1ea;
  --cream2: #ede9e0;
  --white: #ffffff;
  --gold: #c9a96e;
  --gold-dark: #9e7840;
  --gold-light: #e4c48a;
  --navy: #0e1535;
  --navy2: #1a2448;
  --tpe-bg: #f0ede6;
  --tpe-accent: #7a5c3a;
  --tpe-accent-light: #c4956a;
  --text: #1a1508;
  --text2: #4a4030;
  --text3: #8a7a62;
  --border: rgba(90,70,30,0.13);
  --border2: rgba(90,70,30,0.22);
  --shadow-sm: 0 2px 8px rgba(30,20,5,0.07), 0 0 0 1px rgba(90,70,30,0.08);
  --shadow-md: 0 4px 20px rgba(30,20,5,0.10), 0 0 0 1px rgba(90,70,30,0.10);
  --shadow-lg: 0 8px 32px rgba(30,20,5,0.13), 0 0 0 1px rgba(90,70,30,0.12);
  --serif: 'Playfair Display', Georgia, serif;
  --sans: 'DM Sans', sans-serif;
  --mono: 'DM Mono', monospace;
}
 
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
 
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
 
/* ─── NAVBAR ─── */
.navbar {
  position: sticky; top: 0; z-index: 200;
  background: rgba(245,241,234,0.94);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border2);
  box-shadow: 0 1px 12px rgba(30,20,5,0.06);
  padding: 0 40px; height: 58px;
  display: flex; align-items: center; justify-content: space-between; gap: 32px;
}
.nav-left { display: flex; align-items: baseline; gap: 10px; }
.nav-brand-name { font-family: var(--serif); font-size: 20px; font-weight: 700; color: var(--navy); letter-spacing: -0.02em; line-height: 1; }
.nav-brand-name em { color: var(--gold); font-style: italic; }
.nav-brand-sub { font-size: 10px; font-weight: 400; color: var(--text3); letter-spacing: 0.12em; text-transform: uppercase; }
.nav-search { flex: 1; max-width: 380px; position: relative; }
.nav-search input {
  width: 100%; background: rgba(255,255,255,0.8);
  border: 1px solid var(--border2); color: var(--text);
  font-family: var(--sans); font-size: 13px;
  padding: 8px 14px 8px 34px; outline: none; border-radius: 100px;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.nav-search input::placeholder { color: var(--text3); }
.nav-search input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,169,110,0.18); }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 13px; pointer-events: none; }
.nav-datetime { font-family: var(--mono); font-size: 10px; color: var(--text3); letter-spacing: 0.04em; text-align: right; line-height: 1.5; flex-shrink: 0; }
 
/* ─── BRIEFING BAR ─── */
.briefing-bar {
  background: var(--navy);
  padding: 9px 40px;
  display: flex; align-items: center; gap: 12px;
}
.live-pill { display: flex; align-items: center; gap: 5px; background: rgba(201,169,110,0.2); border: 1px solid rgba(201,169,110,0.35); padding: 2px 10px; border-radius: 100px; flex-shrink: 0; }
.live-dot { width: 5px; height: 5px; background: var(--gold-light); border-radius: 50%; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
.live-text { font-size: 9px; font-weight: 500; color: var(--gold-light); letter-spacing: 0.1em; text-transform: uppercase; }
.briefing-stats { font-size: 12px; color: rgba(255,255,255,0.55); }
.briefing-stats strong { color: var(--gold-light); font-weight: 500; }
.briefing-time { margin-left: auto; font-family: var(--mono); font-size: 10px; color: rgba(255,255,255,0.3); }
 
/* ─── TABS ─── */
.tabs-bar {
  background: var(--cream2);
  border-bottom: 1px solid var(--border2);
  padding: 0 40px;
  display: flex; gap: 0; overflow-x: auto; scrollbar-width: none;
}
.tabs-bar::-webkit-scrollbar { display: none; }
.tab { padding: 12px 20px; font-size: 12px; font-weight: 400; color: var(--text3); letter-spacing: 0.04em; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s; user-select: none; }
.tab:hover { color: var(--text2); }
.tab.active { color: var(--gold-dark); font-weight: 500; border-bottom-color: var(--gold); }
.tab-new { font-size: 8px; font-weight: 600; color: var(--gold-dark); background: rgba(201,169,110,0.18); padding: 1px 5px; border-radius: 3px; margin-left: 5px; vertical-align: middle; letter-spacing: 0.06em; }
 
/* ─── PAGE ─── */
.page { padding: 36px 40px 64px; }
 
/* ─── SECTION LABELS ─── */
.section-label {
  font-size: 10px; font-weight: 600; color: var(--gold-dark);
  letter-spacing: 0.14em; text-transform: uppercase;
  margin-bottom: 16px; display: flex; align-items: center; gap: 10px;
}
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--border2); }
 
/* ─── HERO ─── */
.hero-section { margin-bottom: 44px; }
.hero-grid {
  display: grid; grid-template-columns: 1.65fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 12px;
}
.hero-main {
  grid-row: 1 / 3;
  background: var(--navy2);
  border-radius: 16px;
  padding: 32px 28px;
  display: flex; flex-direction: column; justify-content: flex-end;
  min-height: 300px; position: relative; cursor: pointer;
  box-shadow: var(--shadow-lg);
  transition: transform 0.2s, box-shadow 0.2s;
  overflow: hidden;
}
.hero-main:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(30,20,5,0.18); }
.hero-main-bg { position: absolute; inset: 0; background: linear-gradient(135deg, #0e1535 0%, #1a2448 45%, #2a1f5e 100%); }
.hero-main-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(14,21,53,0.97) 25%, rgba(14,21,53,0.3) 100%); }
.hero-main-content { position: relative; z-index: 1; }
.hero-cat-badge { display: inline-block; font-size: 9px; font-weight: 500; color: var(--gold-light); background: rgba(201,169,110,0.18); border: 1px solid rgba(201,169,110,0.3); padding: 3px 10px; border-radius: 100px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; }
.hero-main-title { font-family: var(--serif); font-size: 22px; font-weight: 700; color: #fff; line-height: 1.3; margin-bottom: 10px; }
.hero-main-meta { display: flex; align-items: center; gap: 8px; }
.hero-source { font-size: 11px; color: var(--gold-light); font-weight: 500; }
.hero-time { font-family: var(--mono); font-size: 10px; color: rgba(255,255,255,0.35); }
.hero-summary-expanded { display: none; margin-top: 12px; font-size: 13px; color: rgba(255,255,255,0.7); line-height: 1.6; }
.hero-main.expanded .hero-summary-expanded { display: block; }
 
.hero-secondary {
  background: var(--white);
  border-radius: 12px; padding: 18px 20px;
  display: flex; flex-direction: column; justify-content: space-between;
  cursor: pointer; min-height: 130px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  transition: transform 0.15s, box-shadow 0.15s;
}
.hero-secondary:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.hero-sec-cat { font-size: 9px; font-weight: 600; color: var(--gold-dark); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 7px; }
.hero-sec-title { font-family: var(--serif); font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.4; flex: 1; margin-bottom: 10px; }
.hero-secondary:hover .hero-sec-title { color: var(--navy); }
.hero-sec-meta { display: flex; align-items: center; gap: 6px; }
.hero-sec-source { font-size: 11px; color: var(--gold-dark); font-weight: 500; }
.hero-sec-time { font-family: var(--mono); font-size: 10px; color: var(--text3); }
.hero-sec-summary { display: none; margin-top: 8px; font-size: 12px; color: var(--text2); line-height: 1.6; border-top: 1px solid var(--border); padding-top: 8px; }
.hero-secondary.expanded .hero-sec-summary { display: block; }
 
/* ─── CAT GRIDS ─── */
.cat-grid-wrap { margin-bottom: 44px; }
.cat-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
.cat-grid-2 { display: grid; grid-template-columns: repeat(2,1fr); gap: 12px; margin-top: 12px; }
 
.cat-card {
  background: var(--white);
  border-radius: 14px; padding: 20px 22px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  transition: transform 0.15s, box-shadow 0.15s;
}
.cat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
 
.cat-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.cat-card-title { font-size: 10px; font-weight: 600; color: var(--gold-dark); letter-spacing: 0.1em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
.cat-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }
.cat-count { font-family: var(--mono); font-size: 10px; color: var(--text3); background: rgba(201,169,110,0.1); padding: 2px 7px; border-radius: 20px; }
 
.art-item { padding: 9px 0; border-bottom: 1px solid rgba(90,70,30,0.06); cursor: pointer; }
.art-item:last-child { border-bottom: none; padding-bottom: 0; }
.art-item:first-child { padding-top: 0; }
.art-title { font-size: 13px; font-weight: 400; color: var(--text); line-height: 1.5; margin-bottom: 4px; transition: color 0.15s; }
.art-item:hover .art-title { color: var(--navy); }
.art-meta { display: flex; align-items: center; gap: 6px; }
.art-source { font-size: 11px; font-weight: 500; color: var(--gold-dark); }
.art-sep { font-size: 10px; color: var(--border2); }
.art-time { font-family: var(--mono); font-size: 10px; color: var(--text3); }
.art-summary { display: none; margin-top: 8px; padding: 9px 12px; background: rgba(201,169,110,0.07); border-left: 2px solid var(--gold); border-radius: 0 6px 6px 0; font-size: 12px; color: var(--text2); line-height: 1.65; }
.art-item.expanded .art-summary { display: block; }
 
/* ─── TPE/PME/ETI SECTION ─── */
.tpe-section { margin-bottom: 44px; }
 
.tpe-banner {
  background: linear-gradient(135deg, #2c1f0e 0%, #3d2c14 50%, #2c1f0e 100%);
  border-radius: 16px 16px 0 0;
  padding: 18px 28px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 -2px 0 rgba(201,169,110,0.3) inset;
}
.tpe-banner-left { display: flex; align-items: center; gap: 14px; }
.tpe-banner-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: rgba(201,169,110,0.2); border: 1px solid rgba(201,169,110,0.35);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}
.tpe-banner-title { font-family: var(--serif); font-size: 18px; font-weight: 700; color: #fff; letter-spacing: -0.01em; }
.tpe-banner-sub { font-size: 11px; color: rgba(201,169,110,0.7); margin-top: 1px; letter-spacing: 0.03em; }
.tpe-banner-stats { display: flex; gap: 24px; }
.tpe-stat { text-align: center; }
.tpe-stat-n { font-family: var(--serif); font-size: 22px; font-weight: 700; color: var(--gold-light); line-height: 1; }
.tpe-stat-l { font-size: 9px; color: rgba(255,255,255,0.4); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }
 
.tpe-grid-wrap {
  background: var(--tpe-bg);
  border: 1px solid rgba(160,120,64,0.2);
  border-top: none;
  border-radius: 0 0 16px 16px;
  padding: 20px;
  box-shadow: var(--shadow-md);
}
.tpe-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
 
.tpe-card {
  background: var(--white);
  border-radius: 12px; padding: 16px 18px;
  border: 1px solid rgba(160,120,64,0.18);
  box-shadow: 0 2px 10px rgba(60,35,5,0.08), 0 0 0 1px rgba(160,120,64,0.08);
  transition: transform 0.15s, box-shadow 0.15s;
  cursor: pointer;
}
.tpe-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(60,35,5,0.13); }
 
.tpe-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding-bottom: 9px; border-bottom: 1px solid rgba(160,120,64,0.12); }
.tpe-card-title { font-size: 10px; font-weight: 600; color: var(--tpe-accent); letter-spacing: 0.1em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
.tpe-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--tpe-accent-light); flex-shrink: 0; }
.tpe-badge { font-size: 9px; color: var(--tpe-accent); background: rgba(122,92,58,0.1); border: 1px solid rgba(122,92,58,0.2); padding: 2px 7px; border-radius: 20px; font-family: var(--mono); }
 
.tpe-item { padding: 9px 0; border-bottom: 1px solid rgba(122,92,58,0.07); cursor: pointer; }
.tpe-item:last-child { border-bottom: none; padding-bottom: 0; }
.tpe-item:first-child { padding-top: 0; }
.tpe-item-title { font-size: 13px; font-weight: 400; color: var(--text); line-height: 1.5; margin-bottom: 5px; transition: color 0.15s; }
.tpe-item:hover .tpe-item-title { color: var(--tpe-accent); }
.tpe-item-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tpe-source { font-size: 11px; font-weight: 500; color: var(--tpe-accent-light); }
.tpe-size-tag { font-size: 9px; color: var(--tpe-accent); background: rgba(122,92,58,0.08); border: 1px solid rgba(122,92,58,0.15); padding: 1px 6px; border-radius: 3px; letter-spacing: 0.04em; }
.tpe-time { font-family: var(--mono); font-size: 10px; color: var(--text3); }
.tpe-summary { display: none; margin-top: 8px; padding: 9px 12px; background: rgba(122,92,58,0.06); border-left: 2px solid var(--tpe-accent-light); border-radius: 0 6px 6px 0; font-size: 12px; color: var(--text2); line-height: 1.65; }
.tpe-item.expanded .tpe-summary { display: block; }
 
.tpe-sources-bar { margin-top: 10px; padding: 10px 0 0; border-top: 1px solid rgba(160,120,64,0.15); display: flex; align-items: center; gap: 8px; }
.tpe-sources-label { font-size: 10px; color: var(--text3); letter-spacing: 0.05em; }
.tpe-source-link { font-size: 11px; color: var(--tpe-accent); text-decoration: none; padding: 3px 10px; border: 1px solid rgba(122,92,58,0.2); border-radius: 20px; transition: all 0.15s; background: rgba(122,92,58,0.04); }
.tpe-source-link:hover { background: rgba(122,92,58,0.1); border-color: rgba(122,92,58,0.35); }
 
/* ─── THEMES ─── */
.themes-card { background: var(--navy); border-radius: 16px; padding: 22px 24px; box-shadow: var(--shadow-lg); }
.themes-heading { font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.35); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 14px; }
.themes-list { display: flex; flex-wrap: wrap; gap: 7px; }
.theme-tag { font-size: 11px; color: rgba(255,255,255,0.5); padding: 5px 13px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 100px; cursor: pointer; transition: all 0.15s; }
.theme-tag:hover { color: var(--gold-light); border-color: rgba(201,169,110,0.35); background: rgba(201,169,110,0.08); }
.theme-tag.active { background: var(--gold); color: var(--navy); border-color: var(--gold); font-weight: 500; }
.tag-n { font-size: 9px; opacity: 0.5; margin-left: 2px; }
 
.no-results { padding: 60px; text-align: center; }
.no-results p { font-size: 14px; color: var(--text3); }
.no-results span { color: var(--gold-dark); font-style: italic; font-family: var(--serif); }
 
/* ─── FOOTER ─── */
footer { background: var(--navy); padding: 16px 40px; display: flex; align-items: center; justify-content: space-between; }
.footer-brand { font-family: var(--serif); font-size: 14px; color: rgba(255,255,255,0.35); }
.footer-brand em { color: var(--gold); font-style: italic; }
.footer-info { font-family: var(--mono); font-size: 10px; color: rgba(255,255,255,0.22); letter-spacing: 0.04em; }
 
@media (max-width: 900px) {
  .navbar, .briefing-bar, .tabs-bar, .page { padding-left: 16px; padding-right: 16px; }
  .hero-grid { grid-template-columns: 1fr; }
  .hero-main { grid-row: auto; min-height: 220px; }
  .cat-grid, .tpe-grid { grid-template-columns: 1fr; }
  .cat-grid-2 { grid-template-columns: 1fr; }
  .tpe-banner { flex-direction: column; gap: 14px; align-items: flex-start; }
}
</style>
</head>

  {category:'Cessions TPE/PME/ETI',title:'Cabinet de conseil RH en région PACA à céder (CA 1,1 M€)',source:'Le Journal des Entreprises',url:'https://www.lejournaldesentreprises.com/',summary:'Cabinet créé en 2010, 8 consultants, clientèle grands comptes. Fondatrice cherche adossement à un groupe pour assurer la continuité.',published_at:ago(6),tags:'PME,conseil,RH,PACA',taille:'PME'},

];
 
const TPE_MOCK = MOCK.filter(i => i.category === 'Cessions TPE/PME/ETI');
const MAIN_MOCK = MOCK.filter(i => i.category !== 'Cessions TPE/PME/ETI');
 
let allData = [], tpeData = [], activeTab = 'Tous', searchQuery = '', activeTag = '', lastUpdated = null;
 
function timeAgo(d) {
  const s = Math.floor((Date.now() - new Date(d)) / 1000);
  if (s < 60) return 'à l\'instant';
  if (s < 3600) return `${Math.floor(s/60)} min`;
  if (s < 86400) return `${Math.floor(s/3600)} h`;
  return `${Math.floor(s/86400)} j`;
}
 
function updateDatetime() {
  const n = new Date();
  const d = n.toLocaleDateString('fr-FR', {weekday:'long',day:'numeric',month:'long'});
  const t = n.toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'});
  document.getElementById('datetime').innerHTML = `${d.charAt(0).toUpperCase()+d.slice(1)}<br>${t}`;
}
 
async function fetchData() {
  allData = MAIN_MOCK;
  tpeData = TPE_MOCK;
  lastUpdated = new Date();
  render();
}
 
function getFiltered() {
  const pool = activeTab === 'Cessions TPE/PME/ETI' ? tpeData : allData;
  return pool.filter(item => {
    const mt = activeTab === 'Tous' || item.category === activeTab;
    const q = searchQuery.toLowerCase();
    const ms = !q || item.title.toLowerCase().includes(q) || item.source.toLowerCase().includes(q) || (item.tags||'').toLowerCase().includes(q);
    const mg = !activeTag || (item.tags||'').toLowerCase().includes(activeTag.toLowerCase());
    return mt && ms && mg;
  });
}
 
function getAllTags() {
  const pool = [...allData, ...tpeData];
  const tc = {};
  pool.forEach(item => (item.tags||'').split(',').forEach(t => { const s=t.trim(); if(s) tc[s]=(tc[s]||0)+1; }));
  return Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,22);
}
 
function groupBy(items) {
  const g = {};
  items.forEach(item => { if(!g[item.category]) g[item.category]=[]; g[item.category].push(item); });
  return g;
}
 
function artHTML(item) {
  return `<div class="art-item" onclick="this.classList.toggle('expanded')">
    <div class="art-title">${item.title}</div>
    <div class="art-meta">
      <span class="art-source">${item.source}</span>
      <span class="art-sep">·</span>
      <span class="art-time">il y a ${timeAgo(item.published_at)}</span>
    </div>
    ${item.summary ? `<div class="art-summary">${item.summary}</div>` : ''}
  </div>`;
}
 
function tpeItemHTML(item) {
  const sizeColor = {'TPE':'rgba(122,92,58,0.12)','PME':'rgba(45,80,45,0.1)','ETI':'rgba(45,60,130,0.1)'};
  const sizeText = {'TPE':'#7a5c3a','PME':'#3a6040','ETI':'#2d4080'};
  const sz = item.taille || '';
  const tagStyle = sz ? `style="color:${sizeText[sz]||'#7a5c3a'};background:${sizeColor[sz]||'rgba(122,92,58,0.12)'}"` : '';
  return `<div class="tpe-item" onclick="this.classList.toggle('expanded')">
    <div class="tpe-item-title">${item.title}</div>
    <div class="tpe-item-meta">
      <span class="tpe-source">${item.source}</span>
      ${sz ? `<span class="tpe-size-tag" ${tagStyle}>${sz}</span>` : ''}
      <span class="tpe-time">il y a ${timeAgo(item.published_at)}</span>
    </div>
    ${item.summary ? `<div class="tpe-summary">${item.summary}</div>` : ''}
  </div>`;
}
 
function renderTPESection(page) {
  const tpe = tpeData.filter(item => {
    const q = searchQuery.toLowerCase();
    const ms = !q || item.title.toLowerCase().includes(q) || (item.tags||'').toLowerCase().includes(q);
    const mg = !activeTag || (item.tags||'').toLowerCase().includes(activeTag.toLowerCase());
    return ms && mg;
  });
 
  const tpeSection = document.createElement('div');
  tpeSection.className = 'tpe-section';
 
  const tpeCount = tpeData.length;
  const tpeCt = tpeData.filter(i=>i.taille==='TPE').length;
  const pmeCt = tpeData.filter(i=>i.taille==='PME').length;
  const etiCt = tpeData.filter(i=>i.taille==='ETI').length;
 
  tpeSection.innerHTML = `
    <div class="tpe-banner">
      <div class="tpe-banner-left">
        <div class="tpe-banner-icon">🏭</div>
        <div>
          <div class="tpe-banner-title">Cessions d'entreprises — France</div>
          <div class="tpe-banner-sub">TPE · PME · ETI · Opportunités de transmission</div>
        </div>
      </div>
      <div class="tpe-banner-stats">
        <div class="tpe-stat"><div class="tpe-stat-n">${tpeCt}</div><div class="tpe-stat-l">TPE</div></div>
        <div class="tpe-stat"><div class="tpe-stat-n">${pmeCt}</div><div class="tpe-stat-l">PME</div></div>
        <div class="tpe-stat"><div class="tpe-stat-n">${etiCt}</div><div class="tpe-stat-l">ETI</div></div>
      </div>
    </div>
    <div class="tpe-grid-wrap">
      <div class="tpe-grid" id="tpeGrid"></div>
      <div class="tpe-sources-bar">
        <span class="tpe-sources-label">Sources :</span>
        <a href="https://www.fusacq.com/buzz/fr" target="_blank" class="tpe-source-link">Fusacq Buzz</a>
        <a href="https://www.lejournaldesentreprises.com/" target="_blank" class="tpe-source-link">Journal des Entreprises</a>
      </div>
    </div>
  `;
  page.appendChild(tpeSection);
 
  // Populate TPE grid — 3 columns by size
  const grid = document.getElementById('tpeGrid');
  const sizes = ['TPE', 'PME', 'ETI'];
  sizes.forEach(size => {
    const items = tpe.filter(i => i.taille === size);
    const card = document.createElement('div');
    card.className = 'tpe-card';
    card.innerHTML = `
      <div class="tpe-card-header">
        <span class="tpe-card-title"><span class="tpe-dot"></span>${size}</span>
        <span class="tpe-badge">${items.length} annonce${items.length>1?'s':''}</span>
      </div>
      ${items.length ? items.map(tpeItemHTML).join('') : '<p style="font-size:12px;color:var(--text3);padding:8px 0">Aucune annonce en ce moment</p>'}
    `;
    grid.appendChild(card);
  });
}
 
function render() {
  const filtered = getFiltered();
  const page = document.getElementById('pageContent');
 
  const total = allData.length + tpeData.length;
  const fiscal = allData.filter(i=>i.category==='Patrimoine & Fiscalité').length;
  const deals = allData.filter(i=>i.category==='M&A France').length;
  document.getElementById('briefingText').innerHTML =
    `<strong>${total}</strong> articles · <strong>${fiscal}</strong> signaux fiscaux · <strong>${deals}</strong> deals M&A · <strong>${tpeData.length}</strong> cessions TPE/PME`;
  const t = lastUpdated ? lastUpdated.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : '—';
  document.getElementById('briefingTime').textContent = `Mis à jour · ${t}`;
  document.getElementById('footerInfo').textContent = `Dernière actualisation · ${t} · Auto-refresh 30 min`;
 
  page.innerHTML = '';
 
  // TPE only tab
  if (activeTab === 'Cessions TPE/PME/ETI') {
    renderTPESection(page);
    return;
  }
 
  if (!filtered.length && !searchQuery && !activeTag) {
    page.innerHTML = `<div class="no-results"><p>Aucun résultat</p></div>`;
    return;
  }
 
  // HERO
  if (activeTab === 'Tous' && !searchQuery && !activeTag) {
    const heroItems = [...filtered].sort((a,b)=>new Date(b.published_at)-new Date(a.published_at)).slice(0,3);
    const heroSection = document.createElement('div');
    heroSection.className = 'hero-section';
    heroSection.innerHTML = `
      <div class="section-label">À la une</div>
      <div class="hero-grid">
        <div class="hero-main" onclick="this.classList.toggle('expanded')">
          <div class="hero-main-bg"></div><div class="hero-main-overlay"></div>
          <div class="hero-main-content">
            <span class="hero-cat-badge">${heroItems[0]?.category||''}</span>
            <div class="hero-main-title">${heroItems[0]?.title||''}</div>
            <div class="hero-main-meta">
              <span class="hero-source">${heroItems[0]?.source||''}</span>
              <span class="hero-time">il y a ${timeAgo(heroItems[0]?.published_at)}</span>
            </div>
            ${heroItems[0]?.summary?`<div class="hero-summary-expanded">${heroItems[0].summary}</div>`:''}
          </div>
        </div>
        ${heroItems.slice(1,3).map(item=>`
          <div class="hero-secondary" onclick="this.classList.toggle('expanded')">
            <div>
              <div class="hero-sec-cat">${item.category}</div>
              <div class="hero-sec-title">${item.title}</div>
            </div>
            <div>
              <div class="hero-sec-meta">
                <span class="hero-sec-source">${item.source}</span>
                <span class="art-sep">·</span>
                <span class="hero-sec-time">il y a ${timeAgo(item.published_at)}</span>
              </div>
              ${item.summary?`<div class="hero-sec-summary">${item.summary}</div>`:''}
            </div>
          </div>
        `).join('')}
      </div>
    `;
    page.appendChild(heroSection);
  }
 
  // CATEGORIES
  const catSection = document.createElement('div');
  catSection.className = 'cat-grid-wrap';
 
  if (activeTab !== 'Tous') {
    catSection.innerHTML = `
      <div class="section-label">${activeTab}</div>
      <div class="cat-grid" style="grid-template-columns:1fr;">
        <div class="cat-card">
          <div class="cat-card-header">
            <span class="cat-card-title"><span class="cat-dot"></span>${activeTab}</span>
            <span class="cat-count">${filtered.length} articles</span>
          </div>
          ${filtered.map(artHTML).join('')}
        </div>
      </div>
    `;
  } else {
    const lbl = document.createElement('div');
    lbl.className = 'section-label';
    lbl.textContent = 'Toutes les catégories';
    catSection.appendChild(lbl);
 
    const groups = groupBy(filtered);
    const cats = Object.entries(groups);
 
    [[0,3],[3,6]].forEach(([from,to]) => {
      const slice = cats.slice(from,to);
      if (!slice.length) return;
      const grid = document.createElement('div');
      grid.className = from > 0 ? 'cat-grid' : 'cat-grid';
      grid.style.marginTop = from > 0 ? '12px' : '0';
      slice.forEach(([cat,items]) => {
        const div = document.createElement('div');
        div.className = 'cat-card';
        div.innerHTML = `
          <div class="cat-card-header">
            <span class="cat-card-title"><span class="cat-dot"></span>${cat}</span>
            <span class="cat-count">${items.length}</span>
          </div>
          ${items.slice(0,3).map(artHTML).join('')}
        `;
        grid.appendChild(div);
      });
      catSection.appendChild(grid);
    });
 
    const last = cats.slice(6,8);
    if (last.length) {
      const grid = document.createElement('div');
      grid.className = 'cat-grid-2';
      last.forEach(([cat,items]) => {
        const div = document.createElement('div');
        div.className = 'cat-card';
        div.innerHTML = `
          <div class="cat-card-header">
            <span class="cat-card-title"><span class="cat-dot"></span>${cat}</span>
            <span class="cat-count">${items.length}</span>
          </div>
          ${items.slice(0,3).map(artHTML).join('')}
        `;
        grid.appendChild(div);
      });
      catSection.appendChild(grid);
    }
  }
  page.appendChild(catSection);
 
  // TPE SECTION always on "Tous"
  if (activeTab === 'Tous' && !searchQuery && !activeTag) {
    renderTPESection(page);
  }
 
  // THEMES
  if (activeTab === 'Tous') {
    const tags = getAllTags();
    const tw = document.createElement('div');
    tw.className = 'themes-card';
    tw.innerHTML = `
      <div class="themes-heading">Thèmes du moment</div>
      <div class="themes-list">
        ${tags.map(([tag,count])=>`<span class="theme-tag ${activeTag===tag?'active':''}" onclick="filterTag('${tag}')">${tag}<span class="tag-n">${count}</span></span>`).join('')}
      </div>
    `;
    page.appendChild(tw);
  }
}
 
function filterTag(tag) { activeTag = activeTag===tag?'':tag; render(); }
 
document.getElementById('tabsBar').addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (!t) return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  activeTab = t.dataset.cat; activeTag = ''; render();
});
 
let st;
document.getElementById('searchInput').addEventListener('input', e => {
  clearTimeout(st); st = setTimeout(()=>{ searchQuery=e.target.value; render(); },220);
});
 
updateDatetime();
setInterval(updateDatetime, 30000);
setInterval(fetchData, 30*60*1000);
fetchData();
</script>
</body>
