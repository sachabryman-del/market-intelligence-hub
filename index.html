<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Finary One — Intelligence Hub</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@300&display=swap');

:root {
  --cream: #f5f0e8;
  --cream2: #ede8de;
  --cream3: #e4ddd0;
  --gold: #c9a96e;
  --gold-dark: #a07840;
  --gold-light: #e8c98a;
  --navy: #0e1535;
  --navy2: #1a2448;
  --text: #1a1508;
  --text2: #4a4030;
  --text3: #8a7a60;
  --border: rgba(90,70,30,0.12);
  --border2: rgba(90,70,30,0.2);
  --tag-bg: rgba(201,169,110,0.12);
  --serif: 'Playfair Display', Georgia, serif;
  --sans: 'DM Sans', sans-serif;
  --mono: 'DM Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--cream);
  color: var(--text);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* ─── NAVBAR ─── */
.navbar {
  position: sticky; top: 0; z-index: 200;
  background: rgba(245,240,232,0.92);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border2);
  padding: 0 40px;
  height: 58px;
  display: flex; align-items: center; justify-content: space-between; gap: 32px;
}

.nav-left { display: flex; align-items: baseline; gap: 10px; }
.nav-brand-name {
  font-family: var(--serif); font-size: 20px; font-weight: 700;
  color: var(--navy); letter-spacing: -0.02em; line-height: 1;
}
.nav-brand-name em { color: var(--gold); font-style: italic; }
.nav-brand-sub {
  font-size: 10px; font-weight: 400; color: var(--text3);
  letter-spacing: 0.12em; text-transform: uppercase;
}

.nav-search {
  flex: 1; max-width: 380px; position: relative;
}
.nav-search input {
  width: 100%; background: rgba(255,255,255,0.7);
  border: 1px solid var(--border2); color: var(--text);
  font-family: var(--sans); font-size: 13px;
  padding: 8px 14px 8px 34px; outline: none;
  border-radius: 100px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.nav-search input::placeholder { color: var(--text3); }
.nav-search input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,169,110,0.15); }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 13px; pointer-events: none; }

.nav-right { display: flex; align-items: center; gap: 20px; flex-shrink: 0; }
.nav-datetime { font-family: var(--mono); font-size: 10px; color: var(--text3); letter-spacing: 0.04em; text-align: right; line-height: 1.5; }

/* ─── BRIEFING BAR ─── */
.briefing-bar {
  background: var(--navy);
  padding: 9px 40px;
  display: flex; align-items: center; gap: 12px;
}
.live-pill {
  display: flex; align-items: center; gap: 5px;
  background: rgba(201,169,110,0.2); border: 1px solid rgba(201,169,110,0.4);
  padding: 2px 10px; border-radius: 100px; flex-shrink: 0;
}
.live-dot { width: 5px; height: 5px; background: var(--gold-light); border-radius: 50%; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.live-text { font-size: 9px; font-weight: 500; color: var(--gold-light); letter-spacing: 0.1em; text-transform: uppercase; }
.briefing-stats { font-size: 12px; color: rgba(255,255,255,0.6); }
.briefing-stats strong { color: var(--gold-light); font-weight: 500; }
.briefing-time { margin-left: auto; font-family: var(--mono); font-size: 10px; color: rgba(255,255,255,0.35); }

/* ─── TABS ─── */
.tabs-bar {
  background: var(--cream2);
  border-bottom: 1px solid var(--border2);
  padding: 0 40px;
  display: flex; gap: 0; overflow-x: auto; scrollbar-width: none;
}
.tabs-bar::-webkit-scrollbar { display: none; }
.tab {
  padding: 12px 20px; font-size: 12px; font-weight: 400;
  color: var(--text3); letter-spacing: 0.04em;
  cursor: pointer; white-space: nowrap;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s; user-select: none;
  position: relative;
}
.tab:hover { color: var(--text2); }
.tab.active { color: var(--gold-dark); font-weight: 500; border-bottom-color: var(--gold); }

/* ─── LAYOUT ─── */
.page { padding: 36px 40px 64px; max-width: 1440px; }

/* ─── HERO GRID (top 3 featured) ─── */
.hero-section { margin-bottom: 48px; }
.hero-label {
  font-size: 10px; font-weight: 500; color: var(--gold-dark);
  letter-spacing: 0.14em; text-transform: uppercase;
  margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
}
.hero-label::after { content: ''; flex: 1; height: 1px; background: var(--border2); }

.hero-grid {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  grid-template-rows: auto auto;
  gap: 2px;
  border-radius: 16px; overflow: hidden;
  border: 1px solid var(--border2);
}

.hero-main {
  grid-row: 1 / 3;
  background: var(--navy2);
  padding: 32px 28px;
  display: flex; flex-direction: column; justify-content: flex-end;
  min-height: 300px;
  position: relative; cursor: pointer;
  transition: background 0.2s;
  text-decoration: none;
}
.hero-main:hover { background: var(--navy); }
.hero-main-bg {
  position: absolute; inset: 0;
  background: linear-gradient(135deg, #0e1535 0%, #1a2448 40%, #2d1f5e 100%);
}
.hero-main-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(14,21,53,0.95) 30%, rgba(14,21,53,0.4) 100%);
}
.hero-main-content { position: relative; z-index: 1; }
.hero-cat-badge {
  display: inline-block; font-size: 9px; font-weight: 500;
  color: var(--gold-light); background: rgba(201,169,110,0.18);
  border: 1px solid rgba(201,169,110,0.3);
  padding: 3px 10px; border-radius: 100px;
  letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px;
}
.hero-main-title {
  font-family: var(--serif); font-size: 24px; font-weight: 700;
  color: #fff; line-height: 1.3; margin-bottom: 10px;
}
.hero-main-meta { display: flex; align-items: center; gap: 8px; }
.hero-source { font-size: 11px; color: var(--gold-light); font-weight: 500; }
.hero-time { font-family: var(--mono); font-size: 10px; color: rgba(255,255,255,0.4); }
.hero-summary-expanded {
  display: none; margin-top: 12px;
  font-size: 13px; color: rgba(255,255,255,0.7); line-height: 1.6;
}
.hero-main.expanded .hero-summary-expanded { display: block; }

.hero-secondary {
  background: var(--cream2);
  padding: 20px 20px;
  display: flex; flex-direction: column; justify-content: space-between;
  cursor: pointer; border-left: 1px solid var(--border2);
  transition: background 0.15s; min-height: 140px;
}
.hero-secondary:first-of-type { border-bottom: 1px solid var(--border2); }
.hero-secondary:hover { background: #fff; }
.hero-sec-cat { font-size: 9px; font-weight: 500; color: var(--gold-dark); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
.hero-sec-title {
  font-family: var(--serif); font-size: 15px; font-weight: 600;
  color: var(--text); line-height: 1.4; margin-bottom: 10px;
  flex: 1;
}
.hero-secondary:hover .hero-sec-title { color: var(--navy); }
.hero-sec-meta { display: flex; align-items: center; gap: 6px; }
.hero-sec-source { font-size: 11px; color: var(--gold-dark); font-weight: 500; }
.hero-sec-time { font-family: var(--mono); font-size: 10px; color: var(--text3); }
.hero-sec-summary {
  display: none; margin-top: 8px;
  font-size: 12px; color: var(--text2); line-height: 1.6;
  border-top: 1px solid var(--border); padding-top: 8px;
}
.hero-secondary.expanded .hero-sec-summary { display: block; }

/* ─── CATEGORIES GRID ─── */
.categories-section { }
.cat-section-label {
  font-size: 10px; font-weight: 500; color: var(--text3);
  letter-spacing: 0.14em; text-transform: uppercase;
  margin-bottom: 20px; display: flex; align-items: center; gap: 8px;
}
.cat-section-label::after { content: ''; flex: 1; height: 1px; background: var(--border2); }

.cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border2); border-radius: 16px; overflow: hidden; border: 1px solid var(--border2); margin-bottom: 2px; }
.cat-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--border2); border-radius: 16px; overflow: hidden; border: 1px solid var(--border2); margin-top: 12px; }

.cat-card {
  background: var(--cream);
  padding: 20px 22px;
  transition: background 0.15s;
}
.cat-card:hover { background: #fff; }

.cat-card-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px; padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.cat-card-title {
  font-size: 10px; font-weight: 600; color: var(--gold-dark);
  letter-spacing: 0.1em; text-transform: uppercase;
  display: flex; align-items: center; gap: 6px;
}
.cat-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }
.cat-count { font-family: var(--mono); font-size: 10px; color: var(--text3); }

.art-item { padding: 9px 0; border-bottom: 1px solid rgba(90,70,30,0.06); cursor: pointer; }
.art-item:last-child { border-bottom: none; padding-bottom: 0; }
.art-item:first-child { padding-top: 0; }
.art-title {
  font-size: 13px; font-weight: 400; color: var(--text);
  line-height: 1.5; margin-bottom: 4px; transition: color 0.15s;
}
.art-item:hover .art-title { color: var(--navy); }
.art-meta { display: flex; align-items: center; gap: 6px; }
.art-source { font-size: 11px; font-weight: 500; color: var(--gold-dark); }
.art-sep { font-size: 10px; color: var(--cream3); }
.art-time { font-family: var(--mono); font-size: 10px; color: var(--text3); }
.art-summary {
  display: none; margin-top: 8px; padding: 9px 12px;
  background: rgba(201,169,110,0.08);
  border-left: 2px solid var(--gold);
  border-radius: 0 6px 6px 0;
  font-size: 12px; color: var(--text2); line-height: 1.65;
}
.art-item.expanded .art-summary { display: block; }

/* ─── THEMES ─── */
.themes-card {
  background: var(--navy);
  border-radius: 16px; padding: 22px 24px; margin-top: 12px;
}
.themes-title-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.themes-heading {
  font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.4);
  letter-spacing: 0.12em; text-transform: uppercase;
}
.themes-list { display: flex; flex-wrap: wrap; gap: 7px; }
.theme-tag {
  font-size: 11px; color: rgba(255,255,255,0.55);
  padding: 5px 13px; background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1); border-radius: 100px;
  cursor: pointer; transition: all 0.15s; letter-spacing: 0.02em;
}
.theme-tag:hover { color: var(--gold-light); border-color: rgba(201,169,110,0.35); background: rgba(201,169,110,0.08); }
.theme-tag.active { background: var(--gold); color: var(--navy); border-color: var(--gold); font-weight: 500; }
.tag-n { font-size: 9px; opacity: 0.5; margin-left: 2px; }

/* ─── EMPTY / NO RESULTS ─── */
.no-results { padding: 60px 40px; text-align: center; }
.no-results p { font-size: 14px; color: var(--text3); }
.no-results span { color: var(--gold-dark); font-style: italic; font-family: var(--serif); }

/* ─── FOOTER ─── */
footer {
  background: var(--navy);
  padding: 16px 40px;
  display: flex; align-items: center; justify-content: space-between;
}
.footer-brand { font-family: var(--serif); font-size: 14px; color: rgba(255,255,255,0.4); }
.footer-brand em { color: var(--gold); font-style: italic; }
.footer-info { font-family: var(--mono); font-size: 10px; color: rgba(255,255,255,0.25); letter-spacing: 0.04em; }

@media (max-width: 900px) {
  .navbar, .briefing-bar, .tabs-bar, .page { padding-left: 16px; padding-right: 16px; }
  .hero-grid { grid-template-columns: 1fr; }
  .hero-main { grid-row: auto; min-height: 220px; }
  .hero-secondary { border-left: none; border-top: 1px solid var(--border2); }
  .cat-grid { grid-template-columns: 1fr; }
  .cat-grid-2 { grid-template-columns: 1fr; }
}
</style>
</head>

  const s = Math.floor((Date.now() - new Date(d)) / 1000);
  if (s < 60) return 'à l\'instant';
  if (s < 3600) return `${Math.floor(s/60)} min`;
  if (s < 86400) return `${Math.floor(s/3600)} h`;
  return `${Math.floor(s/86400)} j`;
}

function updateDatetime() {
  const n = new Date();
  const d = n.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
  const t = n.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
  document.getElementById('datetime').innerHTML = `${d.charAt(0).toUpperCase()+d.slice(1)}<br>${t}`;
}

async function fetchData() {
  if (!SHEET_URL || SHEET_URL === 'YOUR_GOOGLE_SHEETS_CSV_URL') {
    allData = MOCK; lastUpdated = new Date(); render(); return;
  }
  try {
    const r = await fetch(SHEET_URL);
    const txt = await r.text();
    const rows = txt.trim().split('\n');
    const hdrs = rows[0].split(',').map(h => h.replace(/"/g,'').trim());
    allData = rows.slice(1).map(row => {
      const vals = row.match(/(".*?"|[^,]+)(?=\s*,|\s*$)/g) || [];
      const o = {}; hdrs.forEach((h,i) => { o[h] = (vals[i]||'').replace(/"/g,'').trim(); });
      return o;
    }).filter(r => r.title);
    lastUpdated = new Date(); render();
  } catch(e) { allData = MOCK; lastUpdated = new Date(); render(); }
}

function getFiltered() {
  return allData.filter(item => {
    const mt = activeTab === 'Tous' || item.category === activeTab;
    const q = searchQuery.toLowerCase();
    const ms = !q || item.title.toLowerCase().includes(q) || item.source.toLowerCase().includes(q) || (item.tags||'').toLowerCase().includes(q);
    const mg = !activeTag || (item.tags||'').toLowerCase().includes(activeTag.toLowerCase());
    return mt && ms && mg;
  });
}

function getAllTags() {
  const tc = {};
  allData.forEach(item => (item.tags||'').split(',').forEach(t => { const s=t.trim(); if(s) tc[s]=(tc[s]||0)+1; }));
  return Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,22);
}

function groupBy(items) {
  const g = {};
  items.forEach(item => { if(!g[item.category]) g[item.category]=[]; g[item.category].push(item); });
  return g;
}

function artHTML(item) {
  return `<div class="art-item" onclick="this.classList.toggle('expanded')">
    <div class="art-title">${item.title}</div>
    <div class="art-meta">
      <span class="art-source">${item.source}</span>
      <span class="art-sep">·</span>
      <span class="art-time">il y a ${timeAgo(item.published_at)}</span>
    </div>
    ${item.summary ? `<div class="art-summary">${item.summary}</div>` : ''}
  </div>`;
}

function render() {
  const filtered = getFiltered();
  const page = document.getElementById('pageContent');

  // Briefing
  const fiscal = allData.filter(i=>i.category==='Patrimoine & Fiscalité').length;
  const deals = allData.filter(i=>i.category==='M&A France').length;
  document.getElementById('briefingText').innerHTML =
    `<strong>${allData.length}</strong> articles · <strong>${fiscal}</strong> signaux fiscaux · <strong>${deals}</strong> deals M&A`;
  const t = lastUpdated ? lastUpdated.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : '—';
  document.getElementById('briefingTime').textContent = `Mis à jour · ${t}`;
  document.getElementById('footerInfo').textContent = `Dernière actualisation · ${t} · Auto-refresh 30 min`;

  page.innerHTML = '';

  if (!filtered.length) {
    page.innerHTML = `<div class="no-results"><p>Aucun résultat pour <span>"${searchQuery||activeTag}"</span></p></div>`;
    return;
  }

  // HERO SECTION — top 3 articles across all (or current category)
  if (activeTab === 'Tous' && !searchQuery && !activeTag) {
    const heroItems = [...filtered].sort((a,b) => new Date(b.published_at)-new Date(a.published_at)).slice(0,3);
    const heroSection = document.createElement('div');
    heroSection.className = 'hero-section';
    heroSection.innerHTML = `
      <div class="hero-label">À la une</div>
      <div class="hero-grid" id="heroGrid">
        <div class="hero-main" onclick="this.classList.toggle('expanded')">
          <div class="hero-main-bg"></div>
          <div class="hero-main-overlay"></div>
          <div class="hero-main-content">
            <span class="hero-cat-badge">${heroItems[0]?.category||''}</span>
            <div class="hero-main-title">${heroItems[0]?.title||''}</div>
            <div class="hero-main-meta">
              <span class="hero-source">${heroItems[0]?.source||''}</span>
              <span class="hero-time">il y a ${timeAgo(heroItems[0]?.published_at)}</span>
            </div>
            ${heroItems[0]?.summary ? `<div class="hero-summary-expanded">${heroItems[0].summary}</div>` : ''}
          </div>
        </div>
        ${heroItems.slice(1,3).map(item => `
          <div class="hero-secondary" onclick="this.classList.toggle('expanded')">
            <div>
              <div class="hero-sec-cat">${item.category}</div>
              <div class="hero-sec-title">${item.title}</div>
            </div>
            <div>
              <div class="hero-sec-meta">
                <span class="hero-sec-source">${item.source}</span>
                <span class="art-sep">·</span>
                <span class="hero-sec-time">il y a ${timeAgo(item.published_at)}</span>
              </div>
              ${item.summary ? `<div class="hero-sec-summary">${item.summary}</div>` : ''}
            </div>
          </div>
        `).join('')}
      </div>
    `;
    page.appendChild(heroSection);
  }

  // CATEGORIES
  const catSection = document.createElement('div');
  catSection.className = 'categories-section';

  if (activeTab !== 'Tous') {
    // Single category — full width list
    const items = filtered;
    catSection.innerHTML = `
      <div class="cat-section-label">${activeTab}</div>
      <div class="cat-grid" style="grid-template-columns:1fr;">
        <div class="cat-card">
          <div class="cat-card-header">
            <span class="cat-card-title"><span class="cat-dot"></span>${activeTab}</span>
            <span class="cat-count">${items.length} articles</span>
          </div>
          ${items.map(artHTML).join('')}
        </div>
      </div>
    `;
  } else {
    const groups = groupBy(filtered);
    const cats = Object.entries(groups);

    // Label
    const lbl = document.createElement('div');
    lbl.className = 'cat-section-label';
    lbl.textContent = 'Toutes les catégories';
    catSection.appendChild(lbl);

    // First row — 3 cols
    const firstThree = cats.slice(0, 3);
    const grid1 = document.createElement('div');
    grid1.className = 'cat-grid';
    firstThree.forEach(([cat, items]) => {
      const div = document.createElement('div');
      div.className = 'cat-card';
      div.innerHTML = `
        <div class="cat-card-header">
          <span class="cat-card-title"><span class="cat-dot"></span>${cat}</span>
          <span class="cat-count">${items.length}</span>
        </div>
        ${items.slice(0,3).map(artHTML).join('')}
      `;
      grid1.appendChild(div);
    });
    catSection.appendChild(grid1);

    // Second row — 3 cols
    const nextThree = cats.slice(3, 6);
    if (nextThree.length) {
      const grid2 = document.createElement('div');
      grid2.className = 'cat-grid';
      grid2.style.marginTop = '1px';
      nextThree.forEach(([cat, items]) => {
        const div = document.createElement('div');
        div.className = 'cat-card';
        div.innerHTML = `
          <div class="cat-card-header">
            <span class="cat-card-title"><span class="cat-dot"></span>${cat}</span>
            <span class="cat-count">${items.length}</span>
          </div>
          ${items.slice(0,3).map(artHTML).join('')}
        `;
        grid2.appendChild(div);
      });
      catSection.appendChild(grid2);
    }

    // Third row — 2 cols
    const lastTwo = cats.slice(6, 8);
    if (lastTwo.length) {
      const grid3 = document.createElement('div');
      grid3.className = 'cat-grid-2';
      lastTwo.forEach(([cat, items]) => {
        const div = document.createElement('div');
        div.className = 'cat-card';
        div.innerHTML = `
          <div class="cat-card-header">
            <span class="cat-card-title"><span class="cat-dot"></span>${cat}</span>
            <span class="cat-count">${items.length}</span>
          </div>
          ${items.slice(0,3).map(artHTML).join('')}
        `;
        grid3.appendChild(div);
      });
      catSection.appendChild(grid3);
    }
  }

  page.appendChild(catSection);

  // THEMES
  if (activeTab === 'Tous') {
    const tags = getAllTags();
    const tw = document.createElement('div');
    tw.className = 'themes-card';
    tw.innerHTML = `
      <div class="themes-title-bar"><span class="themes-heading">Thèmes du moment</span></div>
      <div class="themes-list">
        ${tags.map(([tag,count]) => `<span class="theme-tag ${activeTag===tag?'active':''}" onclick="filterTag('${tag}')">${tag}<span class="tag-n">${count}</span></span>`).join('')}
      </div>
    `;
    page.appendChild(tw);
  }
}

function filterTag(tag) { activeTag = activeTag === tag ? '' : tag; render(); }

document.getElementById('tabsBar').addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (!t) return;
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  activeTab = t.dataset.cat; activeTag = ''; render();
});

let st;
document.getElementById('searchInput').addEventListener('input', e => {
  clearTimeout(st); st = setTimeout(() => { searchQuery = e.target.value; render(); }, 220);
});

updateDatetime();
setInterval(updateDatetime, 30000);
setInterval(fetchData, 30 * 60 * 1000);
fetchData();
</script>
</body>
</html>
